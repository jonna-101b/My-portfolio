<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Primary Meta Tags -->
  <title>Jonna | Full Stack Developer & Software Engineer</title>
  <meta name="title" content="Jonna | Full Stack Developer & Software Engineer" />
  <meta name="description" content="Portfolio of Jonna — Full Stack Software Engineer specializing in modern MERN stack web applications, scalable APIs, and intuitive user experiences." />
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="./src/assets/Logo/Logo.png" />
  <meta name="theme-color" content="#0b0d0e" />

  <!-- Google Fonts Preconnect & Stylesheet -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet" />

  <!-- Open Graph / Facebook / LinkedIn -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Jonna | Full Stack Developer & Software Engineer" />
  <meta property="og:description" content="Portfolio of Jonna — Full Stack Software Engineer specializing in modern MERN stack web applications, scalable APIs, and intuitive user experiences." />
  <meta property="og:image" content="/Full-orginal.png" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Jonna | Full Stack Developer & Software Engineer" />
  <meta name="twitter:description" content="Portfolio of Jonna — Full Stack Software Engineer specializing in modern MERN stack web applications, scalable APIs, and intuitive user experiences." />
  <meta name="twitter:image" content="/Full-orginal.png" />

  <!-- Theme Script (Prevent FOUC) -->
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('portfolio-theme');
        if (theme !== 'light' && theme !== 'dark') {
          theme = 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      } catch (error) {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.style.colorScheme = 'dark';
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
